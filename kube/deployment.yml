apiVersion: apps/v1
kind: Deployment

metadata:
  name: test-api
  namespace: backend

spec:
  strategy: {}
  replicas: 3

  selector:
    matchLabels:
      app: test-api

  template:
    metadata:
      labels:
        app: test-api

    spec:
      containers:
        - name: test-api
          image: test-api:latest
          imagePullPolicy: IfNotPresent

